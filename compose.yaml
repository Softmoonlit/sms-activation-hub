services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sms_website
      POSTGRES_USER: sms_website
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms_website -d sms_website"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
