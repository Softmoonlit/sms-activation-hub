services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.postgres.prod
    environment:
      POSTGRES_DB: sms_website
      POSTGRES_USER: sms_website
      # POSTGRES_PASSWORD 由 .env.postgres.prod 注入，避免应用密钥注入数据库容器
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms_website -d sms_website"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 不暴露端口到宿主机，数据库仅限容器网络内访问

  app:
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file: .env.prod
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  postgres-data:
